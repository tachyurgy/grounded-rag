name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t grounded-rag:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name grag -p 8000:8000 grounded-rag:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/up; then ok=1; break; fi
            sleep 1
          done
          test -n "$ok" || (docker logs grag; exit 1)
          curl -sf http://localhost:8000/stats
          docker rm -f grag
