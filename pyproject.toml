[project]
name = "grounded-rag"
version = "0.1.0"
description = "A RAG service that refuses to hallucinate: cited, grounding-verified answers over a document corpus."
requires-python = ">=3.11"

[project.optional-dependencies]
chroma = ["chromadb>=0.5,<0.6"]
dev = ["pytest>=8", "ruff>=0.6", "chromadb>=0.5,<0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
